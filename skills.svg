<svg width="700" height="310" viewBox="0 0 700 310" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A7F55"/>
      <stop offset="100%" stop-color="#00FF9C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: 'Fira Code', Consolas, monospace; }
    .t { fill: #00FF9C; font-size: 15px; }
    .l { fill: #c9d1d9; font-size: 14px; }
    .p { fill: #00FF9C; font-size: 14px; font-weight: bold; }
  </style>
  <rect width="700" height="310" rx="12" fill="#0d1117" stroke="#0A7F55" stroke-width="1.5"/>
  <circle cx="22" cy="20" r="5" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="5" fill="#ffbd2e"/>
  <circle cx="58" cy="20" r="5" fill="#27c93f"/>
  <text x="80" y="25" class="t">$ cat skills.txt</text>

  <g>
    <text x="30" y="68" class="l">Windows Administration</text>
    <rect x="250" y="55" width="380" height="14" rx="7" fill="#161b22"/>
    <rect x="250" y="55" width="0" height="14" rx="7" fill="url(#g)" filter="url(#glow)"><animate attributeName="width" from="0" to="228" dur="1.2s" fill="freeze"/></rect>
    <text x="645" y="67" class="p">60%</text>
  </g>
  <g>
    <text x="30" y="108" class="l">Linux Administration</text>
    <rect x="250" y="95" width="380" height="14" rx="7" fill="#161b22"/>
    <rect x="250" y="95" width="0" height="14" rx="7" fill="url(#g)" filter="url(#glow)"><animate attributeName="width" from="0" to="190" dur="1.2s" begin="0.15s" fill="freeze"/></rect>
    <text x="645" y="107" class="p">50%</text>
  </g>
  <g>
    <text x="30" y="148" class="l">Troubleshooting</text>
    <rect x="250" y="135" width="380" height="14" rx="7" fill="#161b22"/>
    <rect x="250" y="135" width="0" height="14" rx="7" fill="url(#g)" filter="url(#glow)"><animate attributeName="width" from="0" to="228" dur="1.2s" begin="0.3s" fill="freeze"/></rect>
    <text x="645" y="147" class="p">60%</text>
  </g>
  <g>
    <text x="30" y="188" class="l">Networking</text>
    <rect x="250" y="175" width="380" height="14" rx="7" fill="#161b22"/>
    <rect x="250" y="175" width="0" height="14" rx="7" fill="url(#g)" filter="url(#glow)"><animate attributeName="width" from="0" to="114" dur="1.2s" begin="0.45s" fill="freeze"/></rect>
    <text x="645" y="187" class="p">30%</text>
  </g>
  <g>
    <text x="30" y="228" class="l">Scripting (PowerShell)</text>
    <rect x="250" y="215" width="380" height="14" rx="7" fill="#161b22"/>
    <rect x="250" y="215" width="0" height="14" rx="7" fill="url(#g)" filter="url(#glow)"><animate attributeName="width" from="0" to="114" dur="1.2s" begin="0.6s" fill="freeze"/></rect>
    <text x="645" y="227" class="p">30%</text>
  </g>
  <g>
    <text x="30" y="268" class="l">SIEM &amp; Detection</text>
    <rect x="250" y="255" width="380" height="14" rx="7" fill="#161b22"/>
    <rect x="250" y="255" width="0" height="14" rx="7" fill="url(#g)" filter="url(#glow)"><animate attributeName="width" from="0" to="38" dur="1.2s" begin="0.75s" fill="freeze"/></rect>
    <text x="645" y="267" class="p">10%</text>
  </g>
</svg>
